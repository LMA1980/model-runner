[workspace]
resolver = "2"
members = [
    "arch-synthetic",
    "core",
    "engine",
    "kernels-rvv",
    "kv",
    "manager",
    "tokenizer",
]

[workspace.dependencies]
arch-synthetic = { path = "arch-synthetic" }
k3-core = { path = "core" }
k3-kv = { path = "kv" }
k3-tokenizer = { path = "tokenizer" }
kernels-rvv = { path = "kernels-rvv" }
arrow-array = "59.3.1"
arrow-buffer = "59.3.1"
fory = "1.7.7"
fory-derive = "1.7.7"
libc = "0.2"
rayon = "1.12"
sendfd = "0.4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["process", "rt", "net", "io-util", "sync", "macros", "signal"] }
zerocopy = { version = "0.8.63", features = ["derive"] }
duckdb = { version = "=1.2.2", default-features = false }



[patch."https://github.com/LMA1980/k3-arch-synthetic.git"]
arch-synthetic = { path = "arch-synthetic" }

[patch."https://github.com/LMA1980/k3-core.git"]
k3-core = { path = "core" }

[patch."https://github.com/LMA1980/k3-engine.git"]
k3-engine = { path = "engine" }

[patch."https://github.com/LMA1980/k3-kernels-rvv.git"]
kernels-rvv = { path = "kernels-rvv" }

[patch."https://github.com/LMA1980/k3-kv.git"]
k3-kv = { path = "kv" }

[patch."https://github.com/LMA1980/k3-manager.git"]
k3-manager = { path = "manager" }

[patch."https://github.com/LMA1980/k3-tokenizer.git"]
k3-tokenizer = { path = "tokenizer" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
