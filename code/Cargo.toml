[workspace]
resolver = "2"
members = [
    "core",
    "engine",
    "engine/crates/arch-synthetic",
    "engine/crates/kernels-rvv",
    "engine/crates/k3-tokenizer",
    "engine/bins/k3-diag",
    "engine/bins/k3-worker",
    "kv",
    "manager",
]

[workspace.dependencies]
k3-core = { path = "core" }
k3-engine = { path = "engine" }
k3-kv = { path = "kv" }
k3-tokenizer = { path = "engine/crates/k3-tokenizer" }
kernels-rvv = { path = "engine/crates/kernels-rvv" }
arch-synthetic = { path = "engine/crates/arch-synthetic" }
arrow-array = "59.3.1"
arrow-buffer = "59.3.1"
fory = "1.7.7"
fory-derive = "1.7.7"
libc = "0.2"
rayon = "1.12"
sendfd = "0.4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["process", "rt", "net", "io-util", "sync", "macros", "signal"] }
zerocopy = { version = "0.8.63", features = ["derive"] }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
