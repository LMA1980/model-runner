version: "2"
name: "K3 Official Tag Release & Packaging"

env:
  CARGO_TERM_COLOR: always

stages:
  - id: release-notes
    name: "Generate Release Notes & Changelog"
    tags: ["docs"]
    threads: 2
    run: |
      PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
      echo "# Release ${K3_TAG_NAME:-draft}" > RELEASE_NOTES.md
      echo "Generated on $(date -u)" >> RELEASE_NOTES.md
      echo "" >> RELEASE_NOTES.md
      echo "## Changes" >> RELEASE_NOTES.md
      git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h by @%an)" >> RELEASE_NOTES.md
      cat RELEASE_NOTES.md
    timeout_seconds: 60

  - id: build-release
    name: "Build Release Binaries"
    working_dir: "code"
    tags: ["k3"]
    depends_on: ["release-notes"]
    threads: 6
    run: "cargo build --workspace --release"
    timeout_seconds: 600

  - id: package-release
    name: "Package Official Release Archive"
    tags: ["k3"]
    depends_on: ["build-release"]
    threads: 2
    run: |
      DIST_DIR="dist/releases/${K3_TAG_NAME:-draft}"
      mkdir -p "$DIST_DIR"
      ARCHIVE_NAME="k3-${K3_TAG_NAME:-draft}-riscv64.tar.gz"
      tar -czf "${DIST_DIR}/${ARCHIVE_NAME}" -C code/target/release $(find code/target/release -maxdepth 1 -type f -executable -printf "%f " 2>/dev/null) RELEASE_NOTES.md 2>/dev/null || tar -czf "${DIST_DIR}/${ARCHIVE_NAME}" RELEASE_NOTES.md
      cd "$DIST_DIR" && sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
      echo "Release package created: ${DIST_DIR}/${ARCHIVE_NAME}"
    timeout_seconds: 180
