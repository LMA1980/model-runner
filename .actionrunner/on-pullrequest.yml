version: "2"
name: "K3 Pull Request Build, Test & Benchmark Validation"

env:
  CARGO_TERM_COLOR: always

stages:
  - id: docs-format
    name: "Verify Markdown Specification Formatting (mdformat)"
    tags: ["docs"]
    threads: 2
    run: "./scripts/format_docs.sh --check"
    timeout_seconds: 300

  - id: arch-integrity
    name: "Verify Architectural Index Integrity"
    tags: ["docs"]
    depends_on: ["docs-format"]
    threads: 2
    run: "test -f decisions/index.md && test -f specs/index.md && test -f features/index.md && test -f user-story/index.md"
    timeout_seconds: 60

  - id: fmt-check
    name: "Verify Rust Formatting (cargo fmt)"
    working_dir: "code"
    tags: ["fmt"]
    threads: 2
    run: "cargo fmt --check"
    timeout_seconds: 120

  - id: clippy-check
    name: "Verify Rust Linter & Clippy Rules (cargo clippy)"
    working_dir: "code"
    tags: ["clippy"]
    depends_on: ["fmt-check"]
    threads: 4
    run: "cargo clippy --workspace --all-targets -- -D warnings"
    timeout_seconds: 300

  - id: audit-check
    name: "Verify Dependencies Security Advisories (cargo audit)"
    working_dir: "code"
    tags: ["audit"]
    depends_on: ["fmt-check"]
    threads: 2
    run: "cargo audit"
    timeout_seconds: 180

  - id: coverage-check
    name: "Evaluate Test Suite & Line Code Coverage (cargo llvm-cov)"
    working_dir: "code"
    tags: ["k3"]
    depends_on: ["clippy-check", "audit-check"]
    threads: 6
    run: "cargo llvm-cov --workspace --summary-only"
    timeout_seconds: 900

  - id: miri-check
    name: "Verify Safe Execution & Undefined Behavior via Miri (cargo +nightly miri test)"
    working_dir: "code"
    tags: ["k3"]
    depends_on: ["coverage-check"]
    threads: 6
    run: "cargo +nightly miri test -p k3-core -p kernels-rvv -p arch-synthetic -p k3-tokenizer --lib"
    timeout_seconds: 900

  - id: bench-run
    name: "Execute Native Micro-Benchmarks (cargo bench)"
    working_dir: "code"
    tags: ["k3"]
    depends_on: ["docs-format", "arch-integrity", "fmt-check", "clippy-check", "audit-check", "coverage-check", "miri-check"]
    threads: 6
    exclusive: true
    run: "cargo bench --workspace"
    timeout_seconds: 900
